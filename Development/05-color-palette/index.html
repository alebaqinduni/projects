<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color Palette</title><style>body{font-family:system-ui;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));min-height:100vh}.swatch{display:flex;align-items:end;justify-content:center;padding:30px 10px;box-sizing:border-box;font-weight:700;cursor:pointer}</style></head><body><div class="grid" id="grid"></div><script>const grid=document.querySelector('#grid');function make(){grid.innerHTML='';for(let i=0;i<8;i++){const c='#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0'),d=document.createElement('div');d.className='swatch';d.style.background=c;d.textContent=c;d.onclick=()=>navigator.clipboard?.writeText(c);grid.appendChild(d)}}make();grid.onclick=e=>{if(e.target===grid)make()};</script></body></html>
