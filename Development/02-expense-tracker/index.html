<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expense Tracker</title><style>body{font-family:system-ui;max-width:760px;margin:40px auto;padding:20px}form{display:flex;gap:8px;flex-wrap:wrap}input,button{padding:10px}li{display:flex;justify-content:space-between;margin:8px 0}</style></head><body><h1>Expense Tracker</h1><form id="form"><input id="name" required placeholder="Expense"><input id="amount" required type="number" min="0" step="0.01" placeholder="Amount"><button>Add</button></form><h2>Total: $<span id="total">0.00</span></h2><ul id="list"></ul><script>const f=document.querySelector('#form'),l=document.querySelector('#list'),t=document.querySelector('#total');let items=[];f.addEventListener('submit',e=>{e.preventDefault();items.push({name:name.value,amount:+amount.value});f.reset();render()});function render(){l.innerHTML=items.map((x,i)=>`<li>${x.name} — $${x.amount.toFixed(2)} <button onclick="removeItem(${i})">Remove</button></li>`).join('');t.textContent=items.reduce((a,x)=>a+x.amount,0).toFixed(2)}function removeItem(i){items.splice(i,1);render()}</script></body></html>
