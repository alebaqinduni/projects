<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSON Formatter</title><style>body{font-family:system-ui;max-width:900px;margin:30px auto;padding:20px}textarea{width:100%;height:260px;font-family:monospace}button{padding:10px;margin:10px 0}.error{color:#b00}</style></head><body><h1>JSON Formatter</h1><textarea id="input" placeholder='{"hello":"world"}'></textarea><button onclick="formatJson()">Format</button><button onclick="minifyJson()">Minify</button><p id="status"></p><script>const input=document.querySelector('#input'),status=document.querySelector('#status');function run(space){try{const obj=JSON.parse(input.value);input.value=JSON.stringify(obj,null,space);status.textContent='Valid JSON';status.className=''}catch(e){status.textContent='Invalid JSON: '+e.message;status.className='error'}}function formatJson(){run(2)}function minifyJson(){run(0)}</script></body></html>
