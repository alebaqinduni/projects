<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password Generator</title><style>body{font-family:system-ui;max-width:600px;margin:50px auto;padding:20px}input,button{padding:10px;margin:5px 0}</style></head><body><h1>Password Generator</h1><label>Length <input id="len" type="number" min="8" max="64" value="16"></label><br><label><input id="symbols" type="checkbox" checked> Symbols</label><br><button onclick="generate()">Generate</button><input id="out" readonly style="width:100%"><script>function generate(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789'+(symbols.checked?'!@#$%^&*_-+=?':'');let x='';const a=new Uint32Array(+len.value);crypto.getRandomValues(a);for(let n of a)x+=chars[n%chars.length];out.value=x}generate()</script></body></html>
