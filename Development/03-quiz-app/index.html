<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JavaScript Quiz</title><style>body{font-family:system-ui;max-width:700px;margin:50px auto;padding:20px}button{display:block;margin:10px 0;padding:10px;width:100%}</style></head><body><h1 id="q"></h1><div id="answers"></div><p id="score"></p><script>const data=[['What does HTML stand for?',['HyperText Markup Language','HighText Machine Language','Home Tool Markup Language'],0],['Which keyword declares a constant in JavaScript?',['var','let','const'],2],['Which method converts JSON text to an object?',['JSON.parse','JSON.stringify','JSON.object'],0]];let i=0,s=0;function render(){if(i>=data.length){q.textContent='Finished!';answers.innerHTML='';score.textContent=`Score: ${s}/${data.length}`;return}q.textContent=data[i][0];answers.innerHTML=data[i][1].map((a,n)=>`<button onclick="answer(${n})">${a}</button>`).join('');score.textContent=`Question ${i+1}/${data.length}`}function answer(n){if(n===data[i][2])s++;i++;render()}render();</script></body></html>
