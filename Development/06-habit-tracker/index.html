<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Habit Tracker</title><style>body{font-family:system-ui;max-width:700px;margin:40px auto;padding:20px}li{margin:12px 0}button{margin-left:8px;padding:7px}</style></head><body><h1>Habit Tracker</h1><input id="habit" placeholder="New habit"><button onclick="add()">Add</button><ul id="list"></ul><script>let habits=JSON.parse(localStorage.getItem('habits')||'[]');function save(){localStorage.setItem('habits',JSON.stringify(habits));render()}function add(){const v=habit.value.trim();if(v){habits.push({name:v,done:false});habit.value='';save()}}function toggle(i){habits[i].done=!habits[i].done;save()}function removeHabit(i){habits.splice(i,1);save()}function render(){list.innerHTML=habits.map((h,i)=>`<li><label><input type="checkbox" ${h.done?'checked':''} onchange="toggle(${i})"> ${h.name}</label><button onclick="removeHabit(${i})">Delete</button></li>`).join('')}render()</script></body></html>
