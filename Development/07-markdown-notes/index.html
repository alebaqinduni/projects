<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Markdown Notes</title><style>body{font-family:system-ui;margin:0}.wrap{display:grid;grid-template-columns:1fr 1fr;height:100vh}textarea{padding:20px;font:16px monospace;border:0;border-right:1px solid #ddd}.preview{padding:20px;overflow:auto}code{background:#eee;padding:2px 5px}</style></head><body><div class="wrap"><textarea id="src" placeholder="# Notes\n\nWrite **Markdown** here..."></textarea><main class="preview" id="preview"></main></div><script>function render(){let x=src.value.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\n/g,'<br>');preview.innerHTML=x}src.addEventListener('input',render);render();</script></body></html>
