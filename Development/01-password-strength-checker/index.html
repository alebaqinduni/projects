<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password Strength Checker</title><style>body{font-family:system-ui;max-width:680px;margin:60px auto;padding:20px}input{width:100%;padding:12px;font-size:18px}meter{width:100%;height:24px}.hint{margin-top:12px}</style></head><body><h1>Password Strength Checker</h1><p>Test a password locally. Nothing is sent anywhere.</p><input id="password" type="password" autocomplete="off" placeholder="Enter a password"><meter id="meter" min="0" max="5" value="0"></meter><p id="result" class="hint">Start typing.</p><script>const p=document.querySelector('#password'),m=document.querySelector('#meter'),r=document.querySelector('#result');p.addEventListener('input',()=>{const s=p.value;let score=0;if(s.length>=8)score++;if(s.length>=14)score++;if(/[a-z]/.test(s)&&/[A-Z]/.test(s))score++;if(/\d/.test(s))score++;if(/[^A-Za-z0-9]/.test(s))score++;m.value=score;r.textContent=score<2?'Weak':score<4?'Moderate':'Strong';});</script></body></html>
