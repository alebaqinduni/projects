<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sliding Puzzle</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Sliding Puzzle</h1>
    <p class="instructions">
      Arrange tiles from 1 to 15 in order. Click a tile next to the empty space to move it.
    </p>

    <section class="status-panel" aria-live="polite">
      <p id="statusText">Press “New Game” to start.</p>
      <div class="stats">
        <span>Moves: <strong id="moveCount">0</strong></span>
        <span>Time: <strong id="timer">00:00</strong></span>
      </div>
    </section>

    <div id="board" class="board" role="grid" aria-label="Sliding puzzle board"></div>

    <div class="actions">
      <button id="newGameBtn" type="button">New Game</button>
      <button id="restartBtn" type="button">Restart</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
